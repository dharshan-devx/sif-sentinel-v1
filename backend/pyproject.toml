[project]
name = "sif-backend"
version = "0.1.0"
description = "SIH26165 SIF precursor detection API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2", "alembic>=1.14", "pydantic>=2.9", "pydantic-settings>=2.6",
  "PyJWT>=2.9", "pwdlib[argon2]>=0.2", "python-multipart>=0.0.12", "structlog>=24.4", "email-validator>=2.2", "scikit-learn>=1.5", "joblib>=1.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "aiosqlite>=0.20", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
